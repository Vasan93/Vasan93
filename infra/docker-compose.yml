name: grandmasterai

# Compose resolves its env file relative to *this* file, so the repository-root .env is
# passed explicitly. Without that, ANTHROPIC_API_KEY is silently dropped and the app runs
# in template mode with no explanation.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grandmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grandmaster}
      POSTGRES_DB: ${POSTGRES_DB:-grandmasterai}
    # Bound to loopback: a published port bypasses host firewalls through Docker's own
    # iptables chain, which would put this database on the network.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grandmaster} -d ${POSTGRES_DB:-grandmasterai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Loopback only. An unauthenticated Redis reachable from the network can be made to
    # write arbitrary files.
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    # Secrets and coaching settings come from the repository-root .env.
    env_file:
      - path: ../.env
        required: false
    environment:
      # These must point at Compose service names, so they override anything in .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grandmaster}:${POSTGRES_PASSWORD:-grandmaster}@postgres:5432/${POSTGRES_DB:-grandmasterai}
      REDIS_URL: redis://redis:6379/0
      STOCKFISH_PATH: /usr/games/stockfish
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    environment:
      VITE_API_PROXY: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html

volumes:
  pgdata:
