# Databricks Asset Bundle — Co-Worker Agent
# Deploy with: databricks bundle deploy -t dev
# Run monitor: databricks bundle run proactive_monitor -t dev

bundle:
  name: coworker-agent

variables:
  adf_resource_group:
    description: Azure resource group containing the ADF instance
    default: ""
  adf_factory_name:
    description: Azure Data Factory name
    default: ""
  powerbi_workspace_id:
    description: Power BI workspace (group) ID
    default: ""
  powerbi_dataset_id:
    description: Power BI dataset ID
    default: ""
  cluster_id:
    description: Shared cluster ID (for scheduled jobs that need Spark)
    default: ""
  sql_warehouse_path:
    description: SQL Warehouse HTTP path (for Databricks App — no cluster needed)
    default: ""

# Sync the full repo (app + src + databricks + notebooks) to workspace
sync:
  include:
    - "app/**"
    - "src/**"
    - "databricks/**"
    - "notebooks/**"
    - "copilot_studio/**"
    - "pyproject.toml"
    - "requirements.txt"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${DATABRICKS_HOST}

  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST}
    run_as:
      service_principal_name: coworker-agent-sp

resources:
  # ── Databricks App (FastAPI REST API) ───────────────────────────────────
  apps:
    coworker-agent-app:
      name: coworker-agent
      description: >
        Co-Worker Agent REST API — chat, pipeline monitoring, knowledge base,
        and onboarding.  Teams Bot Framework and Copilot Studio connect here.
      source_code_path: .
      config:
        command:
          - pip
          - install
          - -e
          - .
          - "&&"
          - uvicorn
          - app.main:app
          - --host=0.0.0.0
          - --port=8000
        env:
          - name: SQL_WAREHOUSE_PATH
            value: ${var.sql_warehouse_path}
          - name: DATABRICKS_HOST
            value: ${DATABRICKS_HOST}
      resources:
        - name: coworker-sql-warehouse
          description: Serverless SQL Warehouse for data queries (no cluster needed)
          sql_warehouse:
            existing_warehouse_id: ${var.sql_warehouse_path}

  # ── Scheduled Jobs ──────────────────────────────────────────────────────
  jobs:
    # Proactive Monitor — runs every 30 min
    proactive_monitor:
      name: "[CoWorker] Proactive Monitor"
      description: >
        Checks ADF, Databricks workflows, and Power BI for failures every
        30 minutes.  Diagnoses root causes, auto-recovers transient failures,
        validates post-load data, and alerts the team via Teams.
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: Asia/Dubai
      tasks:
        - task_key: run_monitor
          spark_python_task:
            python_file: ./databricks/jobs/proactive_monitor.py
          existing_cluster_id: ${var.cluster_id}
          libraries:
            - pypi:
                package: openai>=1.60.0
            - pypi:
                package: azure-identity>=1.19.0
            - pypi:
                package: azure-mgmt-datafactory>=9.0.0
            - pypi:
                package: httpx>=0.28.0
      parameters:
        - name: ADF_RESOURCE_GROUP
          default: ${var.adf_resource_group}
        - name: ADF_FACTORY_NAME
          default: ${var.adf_factory_name}
        - name: POWERBI_WORKSPACE_ID
          default: ${var.powerbi_workspace_id}
        - name: POWERBI_DATASET_ID
          default: ${var.powerbi_dataset_id}
      email_notifications:
        on_failure:
          - data-ops@yasentertainment.com
      max_retries: 1
      timeout_seconds: 600

    # Conversation Cleanup — daily at 2 AM
    conversation_cleanup:
      name: "[CoWorker] Conversation Cleanup"
      description: Purge conversation history older than 24 hours.
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: Asia/Dubai
      tasks:
        - task_key: cleanup
          spark_python_task:
            python_file: ./databricks/jobs/cleanup.py
          existing_cluster_id: ${var.cluster_id}
